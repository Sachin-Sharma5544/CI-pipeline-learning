name: ci

on: 
  push: 
    branches: 
      - main
      - "feature/**"

  pull_request: 
    branches: 
      - main
  
  workflow_dispatch: 

jobs: 
  init: 
    name: initialise
    runs-on: ubuntu-latest
    steps:
      - name: Initial step
        run: echo "Initialising CI"


  build: 
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Build Project
        run: npm run build

      - name: Set build date
        id: build_date
        run: echo "date=$(TZ=Asia/Kolkata date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{steps.build_date.outputs.date}}.${{github.run_number}}
          path: dist/  


    