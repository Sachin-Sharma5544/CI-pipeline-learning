
name: cd-auto

on:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  cd:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'development' }}

    steps:
      - name: Auto deployment started
        run: echo "Auto deployment has started"

      - name: Find CI build artifact
        id: artifact_lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .name' \
            | head -n 1)

          if [ -z "$ARTIFACT_NAME" ]; then
            echo "Build artifact not found"
            exit 1
          fi

          echo "Found artifact: $ARTIFACT_NAME"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Download CI build artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: ${{ steps.artifact_lookup.outputs.artifact_name }}
          path: dist

      - name: Verify build artifact
        run: |
          echo "Downloaded build contents"
          ls -la dist

          if [ ! -f "dist/index.html" ]; then
            echo "Build verification failed"
            exit 1
          fi

          echo "Build verification successful"

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: ${{ github.event.workflow_run.head_branch == 'main' && 'deploy --prod --dir=dist' || 'deploy --dir=dist' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deployment Summary
        if: ${{ always() }}
        run: |
          echo "## Automatic Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source Branch | ${{ github.event.workflow_run.head_branch }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'development' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Number | ${{ steps.artifact_lookup.outputs.artifact_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CI Run ID | ${{ github.event.workflow_run.id }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deployment Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
